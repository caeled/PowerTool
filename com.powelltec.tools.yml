app-id: com.powelltec.PowellTecTools
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: PowellTecTools

finish-args:
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: PowellTecTools
    buildsystem: simple
    build-commands:
      - install -Dm755 PowellTecTools /app/bin/PowellTecTools
    sources:
      - type: file
        path: publish/linux-x64/PowellTecTools
