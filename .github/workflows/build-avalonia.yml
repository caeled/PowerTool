name: Build PowellTec Tools (Avalonia)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish single-file Windows exe
        run: |
          dotnet publish ToolsAvaloniaApp/ToolsAvaloniaApp/ToolsAvaloniaApp.csproj `
            -p:PublishProfile=win-x64-single `
            --nologo

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: PowellTecTools-win-x64
          path: publish/win-x64/PowellTecTools.exe
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish single-file Mac binary (arm64)
        run: |
          dotnet publish ToolsAvaloniaApp/ToolsAvaloniaApp/ToolsAvaloniaApp.csproj \
            -p:PublishProfile=osx-arm64 \
            --nologo

      - name: Upload Mac binary (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: PowellTecTools-osx-arm64
          path: publish/osx-arm64/PowellTecTools
          if-no-files-found: error

      - name: Publish single-file Mac binary (Intel x64)
        run: |
          dotnet publish ToolsAvaloniaApp/ToolsAvaloniaApp/ToolsAvaloniaApp.csproj \
            -p:PublishProfile=osx-x64 \
            --nologo

      - name: Upload Mac binary (Intel x64)
        uses: actions/upload-artifact@v4
        with:
          name: PowellTecTools-osx-x64
          path: publish/osx-x64/PowellTecTools
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish linux-x64 binary
        run: |
          dotnet publish ToolsAvaloniaApp/ToolsAvaloniaApp/ToolsAvaloniaApp.csproj \
            -p:PublishProfile=linux-x64 \
            --nologo

      - name: Install flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --repo=repo --force-clean build-dir com.powelltec.tools.yml
          flatpak build-bundle repo PowellTecTools.flatpak com.powelltec.PowellTecTools

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: PowellTecTools-linux-flatpak
          path: PowellTecTools.flatpak
          if-no-files-found: error

  build-relay:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish relay Windows Service
        run: |
          dotnet publish PowellTecRelay/PowellTecRelay.csproj `
            -p:PublishProfile=win-x64 `
            --nologo

      - name: Upload relay
        uses: actions/upload-artifact@v4
        with:
          name: PowellTecRelay-win-x64
          path: publish/relay-win-x64/
          if-no-files-found: error
