name: Build Mac Catalyst

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-maccatalyst:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install pinned MAUI workload (Xcode 16 compatible)
        run: |
          dotnet workload install maui-maccatalyst \
            --source https://api.nuget.org/v3/index.json \
            --version 10.0.0-preview.3.25162.1

      - name: Build Mac Catalyst
        run: |
          cd SupportToolApp
          dotnet publish -f net10.0-maccatalyst -c Release \
            -p:TargetFrameworks=net10.0-maccatalyst \
            -p:ApplicationTitle="PowellTec IT Support Tools" \
            -p:ApplicationId="com.powelltec.supporttools" \
            -p:ApplicationDisplayVersion="1.0.0" \
            -p:ApplicationVersion=1

      - name: Upload Mac app
        uses: actions/upload-artifact@v4
        with:
          name: PowellTec-MacCatalyst
          path: SupportToolApp/bin/Release/net10.0-maccatalyst/**/*.app
          if-no-files-found: warn
